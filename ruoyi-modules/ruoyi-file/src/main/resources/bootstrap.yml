# Tomcat
server:
  port: 9300

# Spring
spring:
  application:
    # 应用名称
    name: ruoyi-file
  profiles:
    # 环境配置
    active: prod
  cloud:
    nacos:
      discovery:
        # 服务注册地址
         #server-addr: 127.0.0.1:8848
        server-addr: 127.0.0.1:8848
      config:
        # 配置中心地址
         #server-addr: 127.0.0.1:8848
        server-addr: 127.0.0.1:8848
        namespace: 172e7c67-00d9-4489-92e9-234aebfc71c0
        # 配置文件格式
        file-extension: yml
        # 共享配置
        shared-configs:
          - application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
